<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея та Відгуки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Галерея мандрівників</h1>
        <p>Яскраві моменти та зворотний зв'язок</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Головна</a></li>
            <li><a href="gallery.html" class="active">Галерея та Відгуки</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Фотогалерея</h2>
            <div class="gallery">
                <div class="gallery-item">
                    <img src="https://picsum.photos/id/1015/300/200" alt="Гори">
                    <p>Величні гори</p>
                </div>
                <div class="gallery-item">
                    <img src="https://picsum.photos/id/1016/300/200" alt="Море">
                    <p>Тепле море</p>
                </div>
                <div class="gallery-item">
                    <img src="https://picsum.photos/id/1043/300/200" alt="Місто">
                    <p>Старовинне місто</p>
                </div>
            </div>
        </section>

        <section class="form-section">
            <h2>Залишити заявку на тур</h2>
            <form action="#" method="post" onsubmit="alert('Дякуємо! Ваша заявка успішно відправлена.'); return false;">
                
                <div class="form-group">
                    <label for="name">Ваше ім'я:</label>
                    <input type="text" id="name" name="name" placeholder="Введіть ім'я" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                </div>

                <div class="form-group">
                    <label for="destination">Оберіть напрямок:</label>
                    <select id="destination" name="destination">
                        <option value="mountains">Карпати</option>
                        <option value="rome">Рим</option>
                        <option value="tokyo">Токіо</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Побажання до туру:</label>
                    <textarea id="message" name="message" rows="4" placeholder="Ваші коментарі..."></textarea>
                </div>

                <button type="submit">Надіслати</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Проєкт виконали учні: Іванов та Петров. Усі права захищені.</p>
    </footer>

</body>
</html>
